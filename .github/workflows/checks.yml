# The studio tests itself.
#
# This repo's governing claim is that a rule nobody executes is not a rule — it is the sentence the
# `defect-hunting` skill is built on and the reason `board-doctor`, `ship-gate` and `runtime-gate`
# exist at all. Until now its own 113-assertion suite ran only when a human remembered, which made
# the suite exactly the thing it warns about.
#
# Three checks, all zero-dependency, all already runnable locally by the same commands:
#   scripts/test.sh          the assertion suite
#   scripts/team-doctor.mjs  the team definition (roles, skills, commands, handoffs, contracts)
#   plugin manifest parse    the two files that decide whether the plugin loads at all
#
# Runs on ubuntu-latest deliberately: the scripts are POSIX sh and Node stdlib, and macOS-only
# behaviour hiding in them (a gawk-ism, a BSD `sed -i` flag, a `plutil` call outside the iOS
# branch) is a portability defect we want to hear about from CI rather than from a user on Linux.

name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # verify-done.sh and integration-branch.sh reason about branches and commit ancestry.
          # A shallow clone makes `git rev-list --count base..branch` wrong rather than failing
          # loudly, which is the worst shape for a check.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assertion suite
        run: sh scripts/test.sh

      - name: Team definition
        run: node scripts/team-doctor.mjs

      - name: Plugin manifests parse
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json']) {
              JSON.parse(fs.readFileSync(f, 'utf8'));
              console.log('ok', f);
            }
          "

      - name: Every skill has valid frontmatter
        run: |
          # A skill whose frontmatter is malformed does not fail loudly — it silently never
          # triggers, which is indistinguishable from a skill that exists and is simply never
          # the right one. Checked mechanically so it cannot rot.
          # BOUNDED TO THE FRONTMATTER BLOCK. These greps scanned the whole file, so a body line
          # reading `name: x` — an example, a table cell, a quoted snippet — satisfied a check about
          # YAML that is only meaningful in the first block. A frontmatter check that a paragraph
          # can pass is the "rule that cannot fail" class, in the file that enforces the rules.
          fm() { awk 'NR==1 && $0!="---" { exit } NR>1 && $0=="---" { exit } NR>1' "$1"; }
          fail=0
          for f in skills/*/SKILL.md; do
            head -n 1 "$f" | grep -qx -- '---' || { echo "MISSING frontmatter opener: $f"; fail=1; continue; }
            fm "$f" | grep -qE '^name: *[a-z0-9-]+ *$' || { echo "MISSING or malformed name: $f"; fail=1; }
            fm "$f" | grep -qE '^description: *\S' || { echo "MISSING description: $f"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "ok — $(ls -d skills/*/ | wc -l | tr -d ' ') skills"

      - name: Every agent has valid frontmatter
        run: |
          fm() { awk 'NR==1 && $0!="---" { exit } NR>1 && $0=="---" { exit } NR>1' "$1"; }
          fail=0
          for f in agents/*.md; do
            head -n 1 "$f" | grep -qx -- '---' || { echo "MISSING frontmatter opener: $f"; fail=1; continue; }
            fm "$f" | grep -qE '^name: *[a-z0-9-]+ *$' || { echo "MISSING or malformed name: $f"; fail=1; }
            fm "$f" | grep -qE '^description: *\S' || { echo "MISSING description: $f"; fail=1; }
            fm "$f" | grep -qE '^tools: *\S' || { echo "MISSING tools: $f"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "ok — $(ls agents/*.md | wc -l | tr -d ' ') agents"

      - name: No hardcoded integration branch
        run: |
          # scripts/integration-branch.sh is the single resolver. A reintroduced `git push origin
          # main` in an agent or command is the one mistake that is not recoverable by a later fix
          # on a project whose release process integrates on develop.
          if grep -rnE 'git (checkout|push origin|merge) main\b' agents/ commands/ 2>/dev/null; then
            echo "Hardcoded integration branch above. Use scripts/integration-branch.sh."
            exit 1
          fi
          echo "ok"

  # The job above can report "402 passed, 0 failed" while containing assertions that cannot fail.
  # On 2026-07-29 it did: a `grep -E` carrying a PCRE lookahead was a syntax error whose stderr went
  # to /dev/null and whose `|| ok` fired every time, two board-doctor assertions stayed green when a
  # gate was DELETED by demoting it to a warning, and a hook stood down in exactly the incident it
  # was written for. All four were found by a reviewer breaking the code by hand and watching
  # whether the suite noticed. `scripts/mutate.sh` is that technique as a command, so it happens on
  # every PR rather than on a good day.
  #
  # A separate job, so it runs in parallel with `checks` rather than adding five minutes to it, and
  # so its verdict is separately visible in the PR status list.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # mutate.sh proves the tree is unchanged by diffing `git status --porcelain` against the
          # snapshot it took at start, and the suite it runs asserts on branch ancestry.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: A sample of gates must still bite
        # A sample rather than all 16: each mutation runs the entire suite (~1 min). The full
        # catalogue is a local and pre-release run. `--sample` spreads across the catalogue rather
        # than taking the first N, because consecutive entries share target files and a sample that
        # only ever probes one script says nothing about the rest.
        #
        # No `|| true`, no `continue-on-error`, and nothing is installed — DR4-023 and DR4-024 are
        # this repo's own generated CI reproducing exactly those two anti-patterns. Exit 1 means a
        # gate can be broken without this repo noticing; that is a blocker, not a warning. A
        # mutation-testing step that cannot itself go red is worth less than nothing.
        run: sh scripts/mutate.sh --sample 4

  # The evaluation laboratory. `mutate.sh` above asks whether one assertion can go red; this asks
  # whether the STUDIO finds a defect planted in a whole project. Every phase after this one is
  # measured against it, which only means something if it runs on every change rather than when
  # someone remembers — the same argument that put the suite itself in CI.
  #
  # It goes red when a planted defect walks past the detector named for it, and when the CLEAN
  # project is blocked by a gate. The second half is not decoration: a studio that refuses
  # everything scores 100% on detection and is useless, and a false block is the failure nobody
  # files a bug about because it looks like diligence.
  #
  # No `|| true`, no `continue-on-error`, and nothing is installed. DR4-023 and DR4-024 are this
  # repo's own generated CI reproducing exactly those two anti-patterns, in a repo built around the
  # sentence forbidding them — and `eval/ci-that-cannot-fail` is that defect planted as a fixture,
  # so a masked exit code here would be this workflow failing the check it is running.
  #
  # A separate job so its verdict is separately visible in the PR status list: "the lab is red" and
  # "the suite is red" are different facts that want different responses.
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # One fixture builds a throwaway git repository to exercise verify-done's branch and
          # commit reasoning. A shallow clone is not the subject here, but the same trap applies.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Every planted defect must be found, and the clean project must not be blocked
        run: node scripts/studio-eval.mjs

  # ------------------------------------------------------------------------------------------------
  # The gate whose whole job is running the artifact — actually run.
  #
  # `runtime-gate.sh` builds the app, launches it, and asserts the process is STILL ALIVE afterwards,
  # because `simctl launch` returns 0 for a program that dies 200ms later. That liveness check is the
  # single claim the entire script exists to make, and until now it had never executed anywhere: the
  # dev machine has Xcode's command-line tools but not Xcode, and ubuntu-latest has neither. Both
  # `mutate.sh` and `studio-eval.mjs` list it as NOT MUTATABLE HERE / unreachable and exclude it from
  # their denominators — honest, and a hole.
  #
  # eval/crash-on-launch is the fixture built for exactly this: an app that COMPILES, INSTALLS, and
  # terminates on the first frame. On this runner the gate must return 1 (FAIL) for it and 0 (PASS)
  # for a working app. A gate that cannot distinguish those two is worse than no gate, and this is
  # the only place that distinction can be proven.
  runtime-gate:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record the toolchain, so CANNOT EVALUATE below is a real finding
        # If this step shows no iOS runtime, every verdict after it is exit 2 and this job proves
        # nothing — worth knowing loudly rather than discovering from a green tick.
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || echo "NO iOS RUNTIME"

      - name: Generate the fixture's Xcode project
        # xcodegen is a RUNNER tool. The plugin still installs nothing; see eval/crash-on-launch/project.yml.
        run: |
          brew install xcodegen
          cd eval/crash-on-launch && xcodegen generate

      - name: The gate must FAIL an app that launches and dies
        # Exit 1 is the pass condition for this step. Exit 0 would mean the gate greenlit a
        # crash-on-launch — the defect the whole script exists to catch. Exit 2 would mean the
        # toolchain is missing on a macOS runner, which proves nothing and is therefore also failure.
        run: |
          sh scripts/runtime-gate.sh --project-root eval/crash-on-launch --platform ios && rc=0 || rc=$?
          echo "runtime-gate exit: $rc"
          case "$rc" in
            1) echo "PASS — the gate refused an app that does not stay up" ;;
            0) echo "FAIL — the gate greenlit a crash-on-launch"; exit 1 ;;
            2) echo "FAIL — CANNOT EVALUATE on a runner that has Xcode; this job proved nothing"; exit 1 ;;
            *) echo "FAIL — unexpected exit $rc"; exit 1 ;;
          esac

      - name: Reset the simulator between the two proofs
        # The mirror test compares two runs, so the two runs must START THE SAME. They did not: the
        # step above leaves a crashed build of studio.eval.SplitEven installed on the device it
        # booted, and the repaired run then reinstalled over it and `simctl launch` failed —
        # verdict FAIL, for a working app, on the second run of the same commit that had passed on
        # the first.
        #
        # That failure was REAL and it was mine, not the gate's: two runs from different starting
        # states are not a comparison, they are two anecdotes. Erasing between them is what makes
        # the pair mean anything.
        #
        # `|| true` is safe here and nowhere else in this file: this is teardown of a device the
        # previous step may or may not have booted, not a check whose verdict could be masked.
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl erase all || true

      - name: THE MIRROR TEST — repair the defect and the same gate must PASS
        # Without this step the step above is satisfied by a gate that fails everything, which
        # scores 100% on detection and is useless. Repairing the one force-unwrap and watching the
        # verdict flip is the only thing that shows the gate is reading the app rather than the
        # weather. Same fixture, same command, one line different, same clean device.
        run: |
          cat > eval/crash-on-launch/src/App.swift <<'SWIFT'
          import SwiftUI

          struct RootView: View {
              let config: Data
              var body: some View { Text("split \(config.count) bytes of config") }
          }

          @main
          struct SplitEvenApp: App {
              let config = Bundle.main.url(forResource: "config", withExtension: "json")
                  .flatMap { try? Data(contentsOf: $0) } ?? Data()
              var body: some Scene { WindowGroup { RootView(config: config) } }
          }
          SWIFT
          sh scripts/runtime-gate.sh --project-root eval/crash-on-launch --platform ios && rc=0 || rc=$?
          echo "runtime-gate exit: $rc"
          git checkout -- eval/crash-on-launch/src/App.swift
          case "$rc" in
            0) echo "PASS — the repaired app builds, launches, and stays up" ;;
            1) echo "FAIL — the gate blocks a working app; the FAIL above was not about the defect"; exit 1 ;;
            2) echo "FAIL — CANNOT EVALUATE on a runner that has Xcode"; exit 1 ;;
            *) echo "FAIL — unexpected exit $rc"; exit 1 ;;
          esac
